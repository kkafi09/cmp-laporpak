services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: laporpak_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laporpak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laporpak_password}
      POSTGRES_DB: ${POSTGRES_DB:-laporpak_db}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ./docker-volume/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laporpak_user} -d ${POSTGRES_DB:-laporpak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laporpak_net

  # backend api
  api:
    image: kkafi09/laporpak-be:latest
    container_name: laporpak_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-laporpak_user}:${POSTGRES_PASSWORD:-laporpak_password}@postgres:5432/${POSTGRES_DB:-laporpak_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-laporpak-production-secret}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${APP_DOMAIN:-laporpak.kafi.gg}}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./docker-volume/api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laporpak_net

  web:
    image: kkafi09/laporpak-fe:latest
    container_name: laporpak_web
    restart: always
    depends_on:
      - api
    networks:
      - laporpak_net
      - jagoteknik-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=jagoteknik-networks"
      - "traefik.http.routers.laporpak.rule=Host(`${APP_DOMAIN:-laporpak.kafi.gg}`)"
      - "traefik.http.routers.laporpak.entrypoints=websecure"
      - "traefik.http.routers.laporpak.tls=true"
      - "traefik.http.routers.laporpak.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.laporpak.loadbalancer.server.port=80"

networks:
  laporpak_net:
    driver: bridge
  jagoteknik-networks:
    external: true
