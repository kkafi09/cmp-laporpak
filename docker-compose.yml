services:
  # postgres + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: laporpak_postgres
    restart: always
    environment:
      POSTGRES_USER: laporpak_user
      POSTGRES_PASSWORD: laporpak_password
      POSTGRES_DB: laporpak_db
    ports:
      - "5435:5432"
    volumes:
      - ./docker-volume/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laporpak_user -d laporpak_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laporpak_net

  # backend api
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: laporpak_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://laporpak_user:laporpak_password@postgres:5432/laporpak_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-laporpak-local-development-secret}
      - APP_ENV=${APP_ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./docker-volume/api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laporpak_net

  # frontend
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: laporpak_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - laporpak_net

networks:
  laporpak_net:
    driver: bridge
